<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>고쳐 입기 스튜디오</title>
<meta name="description" content="패턴으로 재단한 옷을 진짜 천처럼 마네킹에 걸고, 옷 위의 점을 끌어 소매·기장·품·목선을 바꿔요.">
<meta name="theme-color" content="#0f0f0e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121211'/%3E%3Ccircle cx='11' cy='22' r='3.2' fill='none' stroke='%23e8673f' stroke-width='2'/%3E%3Ccircle cx='21' cy='22' r='3.2' fill='none' stroke='%23e8673f' stroke-width='2'/%3E%3Cpath d='M13 19.5 22 7M19 19.5 10 7' stroke='%23efede8' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0f0f0e; --panel:#161615; --panel-2:#1e1e1c; --panel-3:#262624; --line:#2a2a27; --line-2:#3a3a36;
  --text:#efede8; --text-2:#bdbab2; --muted:#8d8a83; --accent:#e8673f; --on-accent:#1b0d07; --accent-soft:rgba(232,103,63,.16);
  --tile:#232321; --focus:#f0a184;
  --sans:"Geist","Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --head:52px; --wl:236px; --wr:320px;
  --glass:color-mix(in srgb,var(--panel) 55%,transparent);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#03050b;color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:relative;z-index:5;height:var(--head);display:flex;align-items:center;gap:14px;padding:0 14px 0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.mark{width:28px;height:28px;border-radius:7px;background:var(--text);color:var(--panel);display:grid;place-items:center}
.mark svg{width:18px;height:18px}
.logo{margin:0;font-weight:700;font-size:16px;letter-spacing:-.03em}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);padding:2px 6px;border:1px solid var(--line-2);border-radius:4px}
.saved{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-left:8px;padding-left:14px;border-left:1px solid var(--line)}
.saved::before{content:"";width:6px;height:6px;border-radius:50%;background:#5fb47a}
.acts{display:flex;align-items:center;gap:2px;margin-left:auto}
.act{display:inline-grid;place-items:center;width:36px;height:34px;border-radius:8px;color:var(--text-2);transition:background .18s var(--ease),color .18s}
.act:hover:not(:disabled){color:var(--text);background:var(--panel-3)}
.act:disabled{opacity:.3;cursor:default}
.act svg{width:18px;height:18px}
.primary{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 12px;margin-left:8px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:600}
.primary:hover{filter:brightness(1.08)}
.primary svg{width:16px;height:16px}

/* stage under glass panels */
.app{position:relative;height:calc(100dvh - var(--head))}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:absolute;top:0;bottom:0;z-index:3;overflow-y:auto;background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2)}
.left{left:0;width:var(--wl);border-right:1px solid var(--line);padding:16px 14px}
.right{right:0;width:var(--wr);border-left:1px solid var(--line);padding:16px 16px 28px}
.sec{margin:0 0 18px}
.sec h2{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--muted);font-family:var(--mono);text-transform:uppercase}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;border-radius:10px;background:var(--panel-2)}
.seg button{height:32px;border-radius:7px;color:var(--text-2);font-size:13px}
.seg button[aria-pressed=true]{background:var(--panel-3);color:var(--text);font-weight:600;box-shadow:inset 0 0 0 1px var(--line-2)}
.wear{display:grid;gap:8px}
.wear button{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--tile);border:1px solid transparent;text-align:left}
.wear button[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--tile))}
.wear svg{width:38px;height:38px;flex:none}
.wear b{display:block;font-size:13px}
.wear small{color:var(--muted);font-size:11.5px}
.note{color:var(--muted);font-size:12px;line-height:1.55;margin:10px 0 0}

/* right panel: tabs, card rows, fine bars */
.tabs{display:flex;gap:4px;margin:0 0 16px;padding:3px;border-radius:10px;background:var(--panel-2)}
.tabs button{flex:1;height:32px;border-radius:7px;color:var(--text-2);font-size:13px}
.tabs button[aria-selected=true]{background:var(--panel-3);color:var(--text);font-weight:600;box-shadow:inset 0 0 0 1px var(--line-2)}
.row h3{margin:0 0 8px;font-size:12.5px;font-weight:600;color:var(--text-2);display:flex;justify-content:space-between}
.row h3 span{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:11.5px}
.row{margin:0 0 16px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cards button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 6px;border-radius:9px;background:var(--tile);border:1px solid transparent;font-size:11.5px;color:var(--text-2)}
.cards button:hover{color:var(--text);border-color:var(--line-2)}
.cards button[aria-pressed=true]{border-color:var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 10%,var(--tile))}
.cards svg{width:38px;height:34px}
details.fine{margin:6px 0 0;border-top:1px solid var(--line);padding-top:12px}
details.fine summary{cursor:pointer;font-size:12.5px;color:var(--text-2);list-style:none;display:flex;justify-content:space-between}
details.fine summary::after{content:"＋";color:var(--muted)}
details.fine[open] summary::after{content:"－"}
.bar{margin:12px 0 0}
.bar label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin:0 0 4px}
.bar label span{font-family:var(--mono);color:var(--muted);font-size:11.5px}
input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);margin:12px 0 0}
.check input{accent-color:var(--accent)}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sw button{aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.sw button[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:2px}
.pick{display:flex;align-items:center;gap:10px;margin:10px 0 0;font-size:12.5px;color:var(--text-2)}
.pick input[type=color]{width:40px;height:28px;border:1px solid var(--line-2);border-radius:6px;background:none;padding:0}
.pick .mono{color:var(--muted)}

/* view buttons, status, drag points, label */
.views{position:absolute;left:50%;bottom:18px;transform:translateX(calc(-50% + (var(--wl) - var(--wr)) / 2));z-index:3;display:flex;gap:2px;padding:4px;border-radius:12px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line)}
.views button{height:30px;padding:0 12px;border-radius:8px;color:var(--text-2);font-size:12.5px}
.views button:hover{background:var(--panel-3);color:var(--text)}
.status{position:absolute;left:calc(var(--wl) + 16px);top:14px;z-index:3;font-size:12px;color:var(--muted);font-family:var(--mono)}
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:2;color:var(--text-2);font-size:14px;pointer-events:none}
.layer{position:absolute;inset:0;z-index:2;pointer-events:none}
.dot{position:absolute;left:0;top:0;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(20,20,20,.75),0 2px 8px rgba(0,0,0,.45);pointer-events:auto;cursor:grab;opacity:.88;transition:transform .12s,opacity .12s,background .12s}
.dot::after{content:"";position:absolute;inset:-9px;border-radius:50%}
.dot:hover{transform:scale(1.25);opacity:1}
.dot.on{background:var(--accent);transform:scale(1.3);opacity:1;cursor:grabbing}
.dot.sq{border-radius:3px}
.dot.edge{transition:none;width:12px;height:12px;margin:-6px 0 0 -6px}
.dot[hidden]{display:none}
.tip{position:absolute;z-index:4;padding:4px 8px;border-radius:6px;background:rgba(10,10,10,.82);color:#fff;font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s}
.tip.show{opacity:1}
.hint{position:absolute;left:calc(var(--wl) + 16px);bottom:22px;z-index:3;font-size:12px;color:var(--muted);max-width:280px;line-height:1.5}
</style>
</head>
<body>
<header class="top">
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7" cy="17" r="3"/><circle cx="17" cy="17" r="3"/><path d="M9 15 18 3M15 15 6 3"/></svg></div>
  <h1 class="logo">고쳐 입기</h1><span class="tag">STUDIO</span>
  <span class="saved">브라우저에 자동 저장</span>
  <div class="acts">
    <button class="act" id="undo" type="button" aria-label="되돌리기 (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="act" id="redo" type="button" aria-label="다시 하기 (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="act" id="reset" type="button" aria-label="처음 옷으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    <button class="primary" id="png" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>PNG 저장</button>
  </div>
</header>
<main class="app">
  <div id="stage"></div>
  <div class="loading" id="loading">마네킹을 불러오는 중…</div>
  <div class="layer" id="layer"></div>
  <div class="tip" id="tip"></div>
  <div class="status mono" id="status"></div>

  <aside class="panel left" aria-label="모델과 옷">
    <section class="sec"><h2>모델</h2>
      <div class="seg" id="body"><button type="button" data-v="f" aria-pressed="true">여성 모델</button><button type="button" data-v="m" aria-pressed="false">남성 모델</button></div>
    </section>
    <section class="sec"><h2>상의</h2>
      <div class="wear"><button type="button" aria-pressed="true"><svg viewBox="0 0 40 40" fill="#f3f1ec" stroke="#8d8a83" stroke-width="1"><path d="M14 6l-8 5 3 7 4-2v18h14V16l4 2 3-7-8-5c-1 3-3 4-6 4s-5-1-6-4z"/></svg><span><b>패턴 상의</b><small>티셔츠·긴팔·민소매·캐미솔</small></span></button></div>
    </section>
    <section class="sec"><h2>하의</h2>
      <div class="seg" id="bottom"><button type="button" data-v="jeans" aria-pressed="true">청바지</button><button type="button" data-v="none" aria-pressed="false">없음</button></div>
      <p class="note">하의는 아직 고칠 수 없어요(다음 단계). 지금은 상의를 받쳐 주는 역할만 해요.</p>
    </section>
  </aside>

  <aside class="panel right" aria-label="옷 고치기">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" aria-selected="true" data-tab="shape">모양</button>
      <button type="button" role="tab" aria-selected="false" data-tab="color">색·무늬</button>
    </div>
    <div data-pane="shape">
      <div class="row"><h3>소매 <span id="lbl-sleeve"></span></h3><div class="cards" id="c-sleeve"></div></div>
      <div class="row"><h3>기장 <span id="lbl-len"></span></h3><div class="cards" id="c-len"></div></div>
      <div class="row"><h3>핏 <span id="lbl-fit"></span></h3><div class="cards" id="c-fit"></div></div>
      <div class="row"><h3>목선 <span id="lbl-neck"></span></h3><div class="cards" id="c-neck"></div></div>
      <label class="check"><input type="checkbox" id="fb" checked> 밑단·목선 앞뒤 같이 끌기</label>
      <label class="check"><input type="checkbox" id="sym" checked> 왼쪽·오른쪽 같이</label>
      <details class="fine" id="fine"><summary>세밀하게</summary><div id="bars"></div></details>
    </div>
    <div data-pane="color" hidden>
      <div class="row"><h3>색</h3><div class="sw" id="sw1"></div>
        <div class="pick"><input type="color" id="c1"><span class="mono" id="c1t"></span></div></div>
      <div class="row"><h3>무늬</h3><div class="cards" id="c-pat"></div></div>
      <div class="row" id="pat2"><h3>무늬 색</h3><div class="sw" id="sw2"></div>
        <div class="pick"><input type="color" id="c2"><span class="mono" id="c2t"></span></div>
        <div class="bar"><label>무늬 크기 <span id="lbl-scale"></span></label><input type="range" id="scale" min="0.5" max="2.5" step="0.05"></div></div>
    </div>
  </aside>

  <div class="views" role="group" aria-label="보는 방향"><button type="button" data-a="0">앞</button><button type="button" data-a="0.7">비스듬히</button><button type="button" data-a="1.5708">옆</button><button type="button" data-a="3.1416">뒤</button></div>
  <p class="hint" id="hint">옷 위의 흰 점을 끌어 보세요 — 소매 끝, 밑단, 옆구리, 목선. 빈 곳을 끌면 돌려 보기, 휠로 확대.</p>
</main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module" src="studio.js?v=47"></script>
</body>
</html>
